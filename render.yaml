# Deploy na Render: um Postgres e um serviço web que roda a API e serve o front.
# Plano gratuito: o serviço dorme após 15 min sem uso e o banco expira em 30 dias.
databases:
  - name: goalspace-db
    plan: free
    region: virginia
    databaseName: goalspace
    user: goalspace

services:
  - type: web
    name: goalspace
    runtime: node
    plan: free
    region: virginia
    # --include=dev: vite, tsup e typescript são devDependencies e o build precisa deles
    buildCommand: npm ci --include=dev && npm run build -w @goalspace/web && npm run build -w @goalspace/api
    # Aplica as migrations antes de subir (o plano gratuito não tem pre-deploy)
    startCommand: npm run start:prod -w @goalspace/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: goalspace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # A Evolution (WhatsApp) não sobe neste plano; a variável é obrigatória na API
      - key: EVOLUTION_API_KEY
        generateValue: true
      - key: WEB_DIST
        value: ../web/dist
